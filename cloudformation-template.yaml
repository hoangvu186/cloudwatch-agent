AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Agent Lab - EC2 Instance with Agent Pre-installed'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t2.micro
      - t2.small
    Description: EC2 Instance Type
  
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of EC2 Key Pair for SSH access
  
  LatestAmiId:
    Type: AWS::EC2::Image::Id
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: Latest Amazon Linux 2 AMI ID

Resources:
  # IAM Role for EC2 instance
  CloudWatchAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudWatchAgentLabRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'

  # Instance Profile to attach role to EC2
  CloudWatchAgentInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CloudWatchAgentRole

  # Security Group for EC2
  CloudWatchAgentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudWatch Agent lab
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: CloudWatchAgentLabSG

  # EC2 Instance with CloudWatch Agent
  CloudWatchAgentInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref CloudWatchAgentInstanceProfile
      SecurityGroupIds:
        - !Ref CloudWatchAgentSecurityGroup
      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: Name
              Value: CloudWatchAgentLab
            - Key: Environment
              Value: Production
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -ex
          
          # Log output
          exec > >(tee /var/log/cloudwatch-setup.log)
          exec 2>&1
          
          echo "Starting CloudWatch Agent installation..."
          
          # Update system
          yum update -y
          
          # Install CloudWatch Agent
          cd /tmp
          wget https://s3.amazonaws.com/amazoncloudwatch-agent/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm
          rpm -U amazon-cloudwatch-agent.rpm
          
          # Create configuration
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'EOFCONFIG'
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "metrics": {
              "namespace": "CustomApplication",
              "metrics_collected": {
                "cpu": {
                  "measurement": [
                    {"name": "cpu_usage_idle", "unit": "Percent"},
                    {"name": "cpu_usage_user", "unit": "Percent"},
                    {"name": "cpu_usage_system", "unit": "Percent"}
                  ],
                  "metrics_collection_interval": 60
                },
                "mem": {
                  "measurement": [
                    {"name": "mem_used_percent", "unit": "Percent"},
                    {"name": "mem_available", "unit": "Megabytes"}
                  ],
                  "metrics_collection_interval": 60
                },
                "disk": {
                  "measurement": [
                    {"name": "used_percent", "unit": "Percent"}
                  ],
                  "metrics_collection_interval": 60,
                  "resources": ["*"]
                }
              },
              "append_dimensions": {
                "InstanceId": "${aws:InstanceId}",
                "Environment": "Production"
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/messages",
                      "log_group_name": "/aws/ec2/cloudwatch-agent-lab",
                      "log_stream_name": "{instance_id}",
                      "retention_in_days": 7
                    }
                  ]
                }
              }
            }
          }
          EOFCONFIG
          
          # Set permissions
          chmod 644 /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
          
          # Start agent
          systemctl enable amazon-cloudwatch-agent
          systemctl start amazon-cloudwatch-agent
          
          echo "CloudWatch Agent installation complete!"
          echo "Agent Version: $(/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent -version)"

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref CloudWatchAgentInstance
    Export:
      Name: CloudWatchAgentLabInstanceId

  InstancePublicIP:
    Description: Public IP of EC2 Instance
    Value: !GetAtt CloudWatchAgentInstance.PublicIp
    Export:
      Name: CloudWatchAgentLabPublicIP

  InstancePrivateIP:
    Description: Private IP of EC2 Instance
    Value: !GetAtt CloudWatchAgentInstance.PrivateIp
    Export:
      Name: CloudWatchAgentLabPrivateIP

  SSHCommand:
    Description: SSH command to connect to instance
    Value: !Sub 'ssh -i /path/to/${KeyName}.pem ec2-user@${CloudWatchAgentInstance.PublicIp}'

  CloudWatchLogsGroup:
    Description: CloudWatch Logs Group for agent logs
    Value: /aws/ec2/cloudwatch-agent-lab

  MetricsNamespace:
    Description: CloudWatch Metrics Namespace
    Value: CustomApplication

  CloudWatchMetricsURL:
    Description: URL to view metrics in CloudWatch
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#metricsV2:namespace=CustomApplication'

  CloudWatchLogsURL:
    Description: URL to view logs in CloudWatch Logs
    Value: !Sub 'https://console.aws.amazon.com/logs/home?region=${AWS::Region}#logStream:group=/aws/ec2/cloudwatch-agent-lab'

  IAMRoleArn:
    Description: IAM Role ARN for EC2 instance
    Value: !GetAtt CloudWatchAgentRole.Arn
